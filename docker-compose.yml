services:
  portal:
    build: .
    container_name: pithagoras
    restart: unless-stopped
    network_mode: host
    volumes:
      # Database, pi's settings and packages, sessions. A named volume unless
      # PORTAL_DATA_DIR is set to an absolute path, which mounts that directory.
      - ${PORTAL_DATA_DIR:-portal-data}:/data
      # Certificates, when you have them. Empty by default.
      - ${PORTAL_TLS_DIR:-/dev/null}:/certs:ro
      # Workspaces pi works in. Read-write: the whole point is that it edits code.
      - ${WORKSPACES_DIR:-/root/repos}:/workspaces
      # Required for managed Browser/Voice add-ons and EXECUTOR=container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Must match container_name; managed voice shares this network namespace.
      PORTAL_CONTAINER_NAME: pithagoras
      # With host networking the portal binds PORT directly on the host.
      PORT: ${PORT:-4100}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      # The portal refuses to start without a password unless this is set, so an
      # empty or misspelt PORTAL_PASSWORD cannot quietly open the port. Set it
      # only for a portal behind a reverse proxy which authenticates already;
      # then nothing here stops whoever reaches the port.
      PORTAL_ALLOW_NO_PASSWORD: ${PORTAL_ALLOW_NO_PASSWORD:-}
      # Keeps logins valid across restarts; generate with: openssl rand -hex 32
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      # host = pi runs in this container | container = one container per task
      EXECUTOR: ${EXECUTOR:-host}
      # Overrides only — left empty so pi's own settings.json (defaultProvider,
      # defaultModel) decides. Baking values in here made those unreachable.
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Serve the portal over TLS when both are given. Needed for the embedded
      # browser: the VNC client refuses to run unless every page above it is
      # secure.
      PORTAL_TLS_CERT: ${PORTAL_TLS_CERT:-}
      PORTAL_TLS_KEY: ${PORTAL_TLS_KEY:-}
      # Where a local llama.cpp server is listening. Host networking means the
      # box's own address works from inside the container unchanged.
      LLAMA_DISK_CACHE_MODELS: ${LLAMA_DISK_CACHE_MODELS:-}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  portal-data:
